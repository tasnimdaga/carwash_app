<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CarWash Premium</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<!-- LOGIN TOP -->
<section class="login-top">

  <h2>Login to Your Account</h2>

  <div class="login-box">
    <input placeholder="Email">
    <input type="password" placeholder="Password">
    <button>Login</button>
  </div>

</section>

<!-- HERO -->
<section class="hero">

  <div class="hero-content">
    <h1>Premium Car Wash Experience</h1>
    <p>Dark luxury style garages with fast booking & navigation</p>
    <button>Explore Nearby</button>
  </div>

</section>

<!-- GARAGES -->
<section class="section">

  <h2>Nearby Garages</h2>

  <div class="grid">

    <div class="card">
      <h3>Porsche Shine Wash</h3>
      <p>⭐ 4.9 • 1.2km</p>
      <a href="https://www.google.com/maps/dir/?api=1&destination=car+wash" target="_blank">
        Get Route
      </a>
    </div>

    <div class="card">
      <h3>Red Line Garage</h3>
      <p>⭐ 4.7 • 2.4km</p>
      <a href="https://www.google.com/maps/dir/?api=1&destination=car+wash" target="_blank">
        Get Route
      </a>
    </div>

  </div>

</section>

<!-- BOOKING + PAYMENT SAME LINE -->
<section class="split-section">

  <!-- BOOKING -->
  <div class="box">

    <h2>Book Service</h2>

    <select>
      <option>Select Garage</option>
    </select>

    <input type="date">
    <input type="time">

    <select>
      <option>Service Type</option>
    </select>

    <button>Confirm Booking</button>

  </div>

  <!-- PAYMENT -->
  <div class="box">

    <h2>Payment</h2>

    <input placeholder="Card Number">
    <input placeholder="Name on Card">

    <div class="row">
      <input placeholder="MM/YY">
      <input placeholder="CVV">
    </div>

    <button>Pay Now</button>

  </div>

</section>

<!-- MAP -->
<section class="section dark">

  <h2>Live Navigation</h2>

  <iframe src="https://maps.google.com/maps?q=car%20wash&output=embed"></iframe>

</section>

</body>
</html>
